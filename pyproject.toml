[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentready"
version = "0.1.0"
description = "Agentic commerce readiness scanner: agent access, UCP/ACP, A2A/MCP, AEO/GEO and task completion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "extruct>=0.17",
  "protego>=0.3",
  "jsonschema>=4.21",
  "referencing>=0.35",
  "Jinja2>=3.1",
  "PyYAML>=6",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "pytest-httpserver>=1.0"]

[project.scripts]
agentready = "agentready.cli:main"

[tool.setuptools.packages.find]
include = ["agentready*"]

[tool.setuptools.package-data]
agentready = ["rubric.yaml", "templates/*.j2", "schemas/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
